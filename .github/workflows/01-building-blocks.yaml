name: 01 - Building Blocks
on:
  push: null
  workflow_dispatch: null

jobs:
  echo-hello:
    name: Echo Hello
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Say hello
        run: echo "Hello, World!"
      - name: echo-goodbye
        run: echo "Goodbye, World!"